<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFest</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/din-alternate" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/detalleActividad.css">
    <link rel="stylesheet" href="css/darktheme.css">

</head>

<body>
    <nav class="container-fluid topbar">
        <ul class="row d-flex justify-content-md-evenly justify-content-between align-items-center barra">
            <div class="col-2 d-flex d-md-none justify-content-start caja-hamburger">
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
            <li class="col-md-2 col-4 logo-container d-flex justify-content-center"><a class="logo"
                    href="./index.html">CampusFest</a></li>
            <li class="col-1 navbar-item"><a href="./actividades.html">Actividades</a></li>
            <li class="col-1 navbar-item"><a href="./actividades.html?disponibles=true">Inscripcion</a></li>
            <li class="col-1 navbar-item"><a href="./agenda.html">Agenda</a></li>
            <li class="col-1 navbar-item"><a href="./stands.html">Stands</a></li>
            <li class="col-1 navbar-item"><a href="./contacto.html">Contacto</a></li>
            <li class="col-md-1 col-2 navbar-icons d-flex justify-content-md-start justify-content-between">
                <i id=tema class="fa-solid fa-circle-half-stroke fa-lg" aria-hidden="true"
                    aria-describedby="Toggle Dark Theme"></i>
                <i id="login" class="fa-regular fa-user fa-xl" aria-hidden="true" aria-describedby="Iniciar Sesión"></i>
                <form class="caja-login d-flex flex-column justify-content-evenly align-items-center"
                    aria-labelledby="crear actividad" novalidate onsubmit="event.preventDefault()">
                    <label class="login-label" for="admin-email">Administrador</label>
                    <input type="email" id="admin-email" name="admin-email" class="admin-email" autocomplete="off">
                    <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>
                </form>
                <div class="caja-logout d-flex flex-column justify-content-evenly align-items-center">
                    <label class="login-label">Ingresado como:</label>
                    <span class="admin-actual"></span>
                    <button type="button" class="btn-login" id="btn-logout">Terminar Sesión</button>
                </div>
            </li>
            <!-- <li class="col-1 navbar-item navbar-user"></li> -->
        </ul>

        <ul class="hamburger-menu">
            <a href="./actividades.html" class="hamburger-item">
                <li>Actividades</li>
            </a>
            <a href="./actividades.html" class="hamburger-item">
                <li>Inscripcion</li>
            </a>
            <a href="./agenda.html" class="hamburger-item">
                <li>Agenda</li>
            </a>
            <a href="./stands.html" class="hamburger-item">
                <li>Stands</li>
            </a>
            <a href="./contacto.html" class="hamburger-item">
                <li>Contacto</li>
            </a>
        </ul>
    </nav>

    <main class="container-xl contenedor d-flex flex-column justify-content-between">
        <div class="row fila1 d-flex justify-content-between">
            <div class="col-lg-6 col-md-12 col-sm-12 caja nombre d-flex justify-content-start    align-items-center">
                <span id="nombre"></span>
            </div>
            <div class="col-lg-3 col-md-12 col-sm-12 caja categoria d-flex flex-row justify-content-start">
                <label for="categoria">Actividades</label>
                <span id="categoria"></span>
            </div>
        </div>
        <div class="row fila2 d-flex justify-content-around">
            <div class="col-lg-8 col-md-12 col-sm-12 caja descripcion d-flex flex-column align-items-start">
                <label for="descripcion">Descripción</label>
                <p class="caja-p" id="descripcion"></p>
            </div>
            <div class="col-lg-3 col-md-12 col-sm-12 d-flex flex-column">
                <div class="caja fecha d-flex flex-column align-items-start">
                    <label for="fecha">Fecha y Hora de Inicio</label>
                    <div class="d-flex flex-row caja-fecha">
                        <span class="input-group-text">
                            <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                        </span>
                        <input aria-required="true" type="datetime-local" id="fechaHora" name="fechaHora"
                            class="form-control">
                    </div>
                </div>
                <div class="caja duracion d-flex flex-column align-items-start">
                    <label for="duracion">Duración</label>
                    <span class="caja-span" id="duracion"></span>
                </div>
                <div class="caja ubicacion d-flex flex-column align-items-start">
                    <label for="ubicacion">Ubicación</label>
                    <p class="caja-p" id="ubicacion"></p>
                </div>
                <div class="caja cupos d-flex flex-column align-items-start">
                    <label for="cuposMax">Cupo máximo</label>
                    <span class="caja-span" id="cuposMax"></span>
                </div>
                <div class="caja cupos d-flex flex-column align-items-start">
                    <label for="cuposDisponibles">Cupos disponibles</label>
                    <span class="caja-span" id="cuposDisponibles"></span>
                </div>
            </div>
        </div>
        </div>
        <div class="row fila3 d-flex justify-content-around">
            <div class="col-lg-8 lg-md-12 caja requisitos d-flex flex-column align-items-start">
                <label for="requisitos">Requisitos</label>
                <p class="caja-p" id="requisitos"></p>
            </div>
            <div class="col-lg-3 col-md-12 d-flex justify-content-center align-items-center"><button
                    id="btnInscripcion">Incribirse</button></div>
        </div>
    </main>
</body>

<script type="module" src="./js/detalleActividad.js"></script>
<script src="./js/hamburger.js"></script>
<script src="./js/login.js"></script>
<script src="./js/darktheme.js"></script>
<script src="./js/navbar.js"></script>

</html>
