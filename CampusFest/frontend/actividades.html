<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFest - Stands</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/din-alternate" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/actividades.css">
    <link rel="stylesheet" href="css/darktheme.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="container-fluid topbar">
        <ul class="row d-flex justify-content-md-evenly justify-content-between align-items-center barra">
            <div class="col-2 d-flex d-md-none justify-content-start caja-hamburger">
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
            <li class="col-md-2 col-4 logo-container d-flex justify-content-center"><a class="logo"
                    href="./index.html">CampusFest</a></li>
            <li class="col-1 navbar-item"><a href="./actividades.html">Actividades</a></li>
            <li class="col-1 navbar-item"><a href="./actividades.html">Inscripcion</a></li>
            <li class="col-1 navbar-item"><a href="./agenda.html">Agenda</a></li>
            <li class="col-1 navbar-item"><a href="./stands.html">Stands</a></li>
            <li class="col-1 navbar-item"><a href="./contacto.html">Contacto</a></li>
            <li class="col-md-1 col-2 navbar-icons d-flex justify-content-md-start justify-content-between">
                <i id=tema class="fa-solid fa-circle-half-stroke fa-lg" aria-hidden="true"
                    aria-describedby="Toggle Dark Theme"></i>
                <i id="login" class="fa-regular fa-user fa-xl" aria-hidden="true" aria-describedby="Iniciar Sesión"></i>
                <form class="caja-login d-flex flex-column justify-content-evenly align-items-center"
                    aria-labelledby="crear actividad" novalidate onsubmit="event.preventDefault()">
                    <label class="login-label" for="admin-email">Administrador</label>
                    <input type="email" id="admin-email" name="admin-email" class="admin-email" autocomplete="off">
                    <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>
                </form>
                <div class="caja-logout d-flex flex-column justify-content-evenly align-items-center">
                    <label class="login-label">Ingresado como:</label>
                    <span class="admin-actual"></span>
                    <button type="button" class="btn-login" id="btn-logout">Terminar Sesión</button>
                </div>
            </li>
            <!-- <li class="col-1 navbar-item navbar-user"></li> -->
        </ul>

        <ul class="hamburger-menu">
            <a href="./actividades.html" class="hamburger-item">
                <li>Actividades</li>
            </a>
            <a href="./actividades.html" class="hamburger-item">
                <li>Inscripcion</li>
            </a>
            <a href="./agenda.html" class="hamburger-item">
                <li>Agenda</li>
            </a>
            <a href="./stands.html" class="hamburger-item">
                <li>Stands</li>
            </a>
            <a href="./contacto.html" class="hamburger-item">
                <li>Contacto</li>
            </a>
        </ul>
    </nav>


    <!-- Barra de búsqueda -->

    <div class="container mt-4">

        <div class="row justify-content-center align-items-center">

            <div class="col-lg-9 col-md-10 col-9">

                <div class="search-bar">

                    <input id="buscador" type="text" class="search-input" placeholder="Buscar actividad">

                    <button id="btn-buscar" class="search-btn">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>


                </div>

            </div>
            <div class="col-auto">
                <div class="filtro-container">

                    <button id="btn-filter" class="filter-btn" aria-expanded="false" aria-haspopup="true">

                        <i class="fa-solid fa-filter"></i>

                    </button>
                    <div id="panel-filtros" class="panel-filtros" hidden>

                        <div class="filtro-item">

                            <label for="filtro-categoria">
                                Categoría
                            </label>

                            <select id="filtro-categoria">
                                <option value="">Todas</option>
                                <option value="Actividades culturales">Culturales</option>
                                <option value="Deportivas">Deportivas</option>
                                <option value="Tecnológicas">Tecnológicas</option>
                                <option value="Artísticas">Artísticas</option>
                                <option value="Gastronómicas">Gastronómicas</option>
                            </select>

                        </div>

                        <div class="filtro-item filtro-disponibilidad">

                            <input type="checkbox" id="filtro-disponibilidad">

                            <label for="filtro-disponibilidad">
                                Solo con cupos disponibles
                            </label>

                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>


    <!-- CONTENIDO -->

    <main class="container-fluid py-4">

        <div id="contenedor" class="row justify-content-center g-4">

        </div>

    </main>

    <!-- Botón de creación -->

    <a href="./crearActividad.html" id="btnCreacion">
        <button class="btn-float">

            <i class="fa-solid fa-plus"></i>

        </button>
    </a>


    <!-- SweetAlert-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/tarjetas-actividades.js"></script>
    <script src="./js/hamburger.js"></script>
    <script src="./js/login.js"></script>
    <script src="./js/darktheme.js"></script>
    <script src="./js/navbar.js"></script>

</body>

</html>
